<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业官网首页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        body {
            color: #333;
            background-color: #f7f9fc;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 顶部导航 */
        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e8ed;
        }

        .nav {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #1a73e8;
        }

        .menu a {
            margin-left: 30px;
            color: #555;
            font-size: 15px;
        }

        .menu a:hover {
            color: #1a73e8;
        }

        /* 首屏 Banner */
        .banner {
            background: linear-gradient(120deg, #1a73e8, #4285f4);
            color: #fff;
            padding: 100px 20px;
            text-align: center;
        }

        .banner h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .banner p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: #fff;
            color: #1a73e8;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
        }

        /* 通用区块 */
        section {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #777;
        }

        /* 服务模块 */
        .services {
            display: flex;
            gap: 30px;
        }

        .service-box {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            flex: 1;
            text-align: center;
        }

        .service-box h3 {
            margin-bottom: 15px;
            color: #1a73e8;
        }

        .service-box p {
            color: #666;
            font-size: 15px;
        }

        /* 关于我们 */
        .about {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .about-text {
            flex: 1;
        }

        .about-text h3 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .about-text p {
            color: #666;
            line-height: 1.8;
        }

        .about-img {
            flex: 1;
            height: 280px;
            background: #e3ebf7;
            border-radius: 12px;
        }

        /* 页脚 */
        footer {
            background: #1f2937;
            color: #bbb;
            padding: 40px 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<!-- 顶部导航 -->
<header>
    <div class="nav">
        <div class="logo">YourBrand</div>
        <div class="menu">
            <a href="#">首页</a>
            <a href="#">服务</a>
            <a href="#">案例</a>
            <a href="#">关于我们</a>
            <a href="#">联系我们</a>
        </div>
    </div>
</header>

<!-- Banner -->
<div class="banner">
    <h1>专注打造高品质网站体验</h1>
    <p>专业 · 简洁 · 高端 · 可信赖</p>
    <a href="#" class="btn">立即了解</a>
</div>

<!-- 服务介绍 -->
<section>
    <div class="section-title">
        <h2>我们的服务</h2>
        <p>为客户提供全方位解决方案</p>
    </div>

    <div class="services">
        <div class="service-box">
            <h3>网站设计</h3>
            <p>高端定制化设计，突出品牌形象，提升用户体验。</p>
        </div>
        <div class="service-box">
            <h3>前端开发</h3>
            <p>结构清晰、性能优秀，适配多端设备。</p>
        </div>
        <div class="service-box">
            <h3>技术支持</h3>
            <p>长期维护与优化，保障系统稳定运行。</p>
        </div>
    </div>
</section>

<!-- 关于我们 -->
<section>
    <div class="about">
        <div class="about-text">
            <h3>关于我们</h3>
            <p>
                我们是一支专注于互联网产品设计与开发的专业团队，
                致力于为客户提供高品质、高效率、可持续发展的数字化解决方案。
            </p>
        </div>
        <div class="about-img"></div>
    </div>
</section>

<!-- 页脚 -->
<footer>
    © 2025 YourBrand · 版权所有 | 粤ICP备XXXXXXX号
</footer>

</body>
</html>
